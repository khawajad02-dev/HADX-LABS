<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberOrb Layout Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: monospace; }
        .gold-glow { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
        .gold-border { border: 1px solid rgba(245, 158, 11, 0.5); }
        .btn-base {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: #F59E0B;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-end justify-end p-12">

    <div id="orb-container" class="relative w-16 h-16 rounded-full gold-border flex items-center justify-center bg-amber-500/10">
        <div class="w-3 h-3 rounded-full bg-amber-500"></div>
        
        <!-- Simulation of buttons -->
        <div id="buttons-container" class="absolute">
            <!-- Buttons will be injected here -->
        </div>
    </div>

    <script>
        const buttons = [
            { id: "cart", label: "[ EXECUTE ORDER ]", angle: 85, distance: 220, padding: "px-10 py-5" },
            { id: "vault", label: "STASH IN VAULT", angle: 55, distance: 180, padding: "px-8 py-4" },
            { id: "audio", label: "AUDIO", angle: 25, distance: 150, padding: "px-6 py-3" },
            { id: "instagram", label: "DM", angle: 0, distance: 130, padding: "px-6 py-3" }
        ];

        const container = document.getElementById('buttons-container');

        buttons.forEach((btn, index) => {
            const rad = (btn.angle * Math.PI) / 180;
            const x = -Math.cos(rad) * btn.distance;
            const y = -Math.sin(rad) * btn.distance;

            const el = document.createElement('div');
            el.className = `absolute btn-base gold-border ${btn.padding}`;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.transform = 'translate(-50%, -50%)';
            el.style.zIndex = 100 - index;
            el.innerText = btn.label;
            container.appendChild(el);
        });
    </script>
</body>
</html>
